manifestVersion: 1

id: alex-remote-desktop-commander
category: files
name: Journal Agent
version: "0.2.51.1"
icon: https://raw.githubusercontent.com/AlexPosazhe/umbrel-private-apps/main/alex-remote-desktop-commander/icon.svg

tagline: Capture, structure and preserve your events

description: >-
  Journal Agent connects ChatGPT to a private journal stored locally on your
  Umbrel, helping you capture, structure and preserve events, notes and context.
  Journaling is not tied to a single input method: use ChatGPT to turn what you
  share into organized records for future reference.
  Built on Desktop Commander Remote, it provides authorized access to your
  local journal and a foundation for future journal workflows and automation.

developer: wonderwhy-er
website: https://desktopcommander.app

dependencies: []

repo: https://github.com/wonderwhy-er/DesktopCommanderMCP
support: https://github.com/wonderwhy-er/DesktopCommanderMCP/issues

port: 3000
gallery: []
path: ""

defaultPassword: ""

releaseNotes: >-
  Renamed to Journal Agent with a light, minimalist journal and sound-wave icon.
  The app ID and Desktop Commander version remain unchanged.
